name: Securock
description: Run securock verify and report trust drift
author: securock
branding:
  icon: shield
  color: gray-dark
inputs:
  path:
    description: Project directory
    default: "."
  command:
    description: "verify, diff, or both"
    default: both
  offline:
    description: Skip remote vulnerability lookups
    default: "false"
  comment:
    description: Comment a trust report on pull requests
    default: "true"
  token:
    description: GitHub token for PR comments and attested release downloads
    default: ${{ github.token }}
  version:
    description: Securock release tag to install. Empty uses a v* action ref, otherwise builds from source.
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve install mode
      id: mode
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION:-}"
        if [ -z "$version" ]; then
          case "${GITHUB_ACTION_REF:-}" in
            v[0-9]*.[0-9]*) version="${GITHUB_ACTION_REF}" ;;
          esac
        fi
        os=$(uname -s)
        case "$os" in
          Linux|Darwin) unix=1 ;;
          *) unix=0 ;;
        esac
        if [ -n "$version" ] && [ "$unix" = 1 ]; then
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        else
          echo "mode=source" >> "$GITHUB_OUTPUT"
        fi
    - name: Resolve Go module files
      if: ${{ steps.mode.outputs.mode == 'source' }}
      id: gomod
      shell: bash
      run: |
        set -euo pipefail
        action_root=$(cd "${GITHUB_ACTION_PATH}" && pwd)
        echo "root=${action_root}" >> "$GITHUB_OUTPUT"
        echo "mod=${action_root}/go.mod" >> "$GITHUB_OUTPUT"
        echo "sum=${action_root}/go.sum" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: ${{ steps.mode.outputs.mode == 'source' }}
      with:
        go-version-file: ${{ steps.gomod.outputs.mod }}
        cache-dependency-path: ${{ steps.gomod.outputs.sum }}
    - name: Install securock from source
      if: ${{ steps.mode.outputs.mode == 'source' }}
      shell: bash
      run: go install ./cmd/securock
      working-directory: ${{ steps.gomod.outputs.root }}
    - name: Install attested securock
      if: ${{ steps.mode.outputs.mode == 'release' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.mode.outputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/securock-bin
        REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        mkdir -p "$INSTALL_DIR"
        "${GITHUB_ACTION_PATH}/scripts/install.sh"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Run securock
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        WORKDIR: ${{ inputs.path }}
        OFFLINE: ${{ inputs.offline }}
        SECUROCK_REPORT: ${{ runner.temp }}/securock-report.txt
      run: "${{ github.action_path }}/action/run.sh"
    - name: Comment trust report
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.run.outcome != 'skipped' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SECUROCK_REPORT: ${{ runner.temp }}/securock-report.txt
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const path = process.env.SECUROCK_REPORT;
          let report = '(no report)';
          if (path && fs.existsSync(path)) {
            report = fs.readFileSync(path, 'utf8').trim() || '(empty report)';
          }
          const body = [
            '## Securock Trust Report',
            '',
            '```',
            report,
            '```',
          ].join('\n');
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body && c.body.startsWith('## Securock Trust Report'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
    - name: Fail on trust drift
      if: ${{ steps.run.outputs.failed == 'true' }}
      shell: bash
      run: exit 1
