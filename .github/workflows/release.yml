name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.sboms.outputs.pairs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          syft-version: v1.51.1
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
            dist/**/securock
            dist/**/securock.exe
      - name: Pair archives with SBOMs
        id: sboms
        run: |
          python3 - <<'PY'
          import json
          import glob
          import os

          pairs = []
          archives = sorted(glob.glob("dist/*.tar.gz") + glob.glob("dist/*.zip"))
          for archive in archives:
              sbom = archive + ".sbom.json"
              if not os.path.isfile(sbom):
                  raise SystemExit(f"missing SBOM for {archive}: expected {sbom}")
              pairs.append({"archive": archive, "sbom": sbom})
          if not pairs:
              raise SystemExit("no release archives found")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("pairs<<EOF\n")
              f.write(json.dumps(pairs))
              f.write("\nEOF\n")
          print(f"paired {len(pairs)} archives with SBOMs")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  attest-sbom:
    name: Attest SBOMs
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        pair: ${{ fromJSON(needs.goreleaser.outputs.pairs) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.pair.archive }}
          sbom-path: ${{ matrix.pair.sbom }}
