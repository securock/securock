name: Example

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - examples/npm
          - examples/pnpm
          - examples/yarn
          - examples/bun
          - examples/uv
          - examples/poetry
          - examples/go
          - examples/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          path: ${{ matrix.path }}
          # Offline fixtures leave evidence unknown; use both (diff+verify)
          # instead of the default all, which also runs scan.
          command: both
          offline: "true"
          comment: "false"
