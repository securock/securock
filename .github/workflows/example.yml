name: Example

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  npm-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        with:
          path: examples/npm
          command: both
          offline: "true"
          comment: "false"
